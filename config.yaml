# Tuning lives here, not in the source, so you can adjust it from the sofa.

vision:
  camera_index: 0
  width: 640            # higher resolution buys nothing for landmark detection
  height: 480
  target_fps: 30
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5
  model_path: models/gesture_recognizer.task   # see scripts/fetch_model.sh

session:
  wake_hold_ms: 800     # how long Open_Palm must be held to arm
  confirm_frames: 8     # ~270ms at 30fps. Raise if false fires, lower if sluggish.
  cooldown_ms: 600      # gap before the same intent can fire again
  repeat_ms: 60         # ramp speed while a repeatable pose is held
  idle_timeout_ms: 10000  # no hand for this long -> disarm
  min_confidence: 0.65
  sleep_confirm_frames: 4   # frames a fist must persist before disarming
  wake_grace_ms: 1000       # ignore the sleep gesture this long after waking

bindings:
  # Victory toggles the session: wake when idle, sleep when armed. Safe on one
  # gesture because a pose that has acted stays inert until you release it.
  Victory:      SESSION_TOGGLE

  # Power also toggles - the adapter reads power-mode and sends PowerOn or
  # PowerOff accordingly, so the same gesture turns the TV on and off.
  # It holds ~3x longer than anything else (session.power_confirm_frames).
  Open_Palm:    POWER_TOGGLE

  Thumb_Up:     VOLUME_UP
  Thumb_Down:   VOLUME_DOWN
  Closed_Fist:  MUTE_TOGGLE
  Pointing_Up:  PLAY_PAUSE

  # ILoveYou is free. Available poses are exactly these seven until custom
  # gestures are trained with MediaPipe Model Maker.

devices:
  - name: living-room
    type: roku
    host: null          # null => autodiscover via SSDP. Run scripts/check_roku.py.
    default: true

