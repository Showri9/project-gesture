# Tuning lives here, not in the source, so you can adjust it from the sofa.

vision:
  camera_index: 0
  width: 640            # higher resolution buys nothing for landmark detection
  height: 480
  target_fps: 30
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5
  model_path: models/gesture_recognizer.task   # see scripts/fetch_model.sh

session:
  wake_hold_ms: 800     # how long Open_Palm must be held to arm
  confirm_frames: 8     # ~270ms at 30fps. Raise if false fires, lower if sluggish.
  cooldown_ms: 600      # gap before the same intent can fire again
  repeat_ms: 60         # ramp speed while a repeatable pose is held
  idle_timeout_ms: 10000  # no hand for this long -> disarm
  min_confidence: 0.65
  sleep_confirm_frames: 4   # frames a fist must persist before disarming
  wake_grace_ms: 1000       # ignore the sleep gesture this long after waking

bindings:
  # Two forms:
  #   Pose: INTENT                              - uses session.confirm_frames
  #   Pose: {intent: INTENT, hold_ms: 3000}     - must be held this long
  #
  # hold_ms is in milliseconds and beats a frame count, because 8 frames is
  # 270ms on a 30fps camera and 530ms on a 15fps one. Put it on anything that
  # feels too easy to trigger by accident.

  # Victory toggles the session: wake when idle, sleep when armed. Safe on one
  # gesture because a pose that has acted stays inert until you release it.
  Victory:      SESSION_TOGGLE

  # Power on and off are separate gestures, so you never have to know what state
  # the TV is in. Both are held for 3 seconds: long enough that neither happens
  # by accident while you are reaching for the remote or stretching.
  Open_Palm:    {intent: POWER_ON,  hold_ms: 1000}
  ILoveYou:     {intent: POWER_OFF, hold_ms: 2000}

  Thumb_Up:     VOLUME_UP
  Thumb_Down:   VOLUME_DOWN
  Pointing_Up:  PLAY_PAUSE

  # Mute is quick on purpose - it is the gesture you want mid-sentence, and
  # getting it wrong costs one more gesture to undo. If it fires by accident,
  # give it a hold too:  Closed_Fist: {intent: MUTE_TOGGLE, hold_ms: 1000}
  Closed_Fist:  {intent: MUTE_TOGGLE, hold_ms: 1000}

devices:
  - name: bed room
    type: roku
    host: null          # null => autodiscover via SSDP. Run scripts/check_roku.py.
    default: true

