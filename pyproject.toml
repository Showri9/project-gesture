[project]
name = "gesturectl"
version = "0.1.0"
description = "Hand-gesture control for TVs and, later, everything else"
requires-python = ">=3.11"
dependencies = [
    # PINNED, and not casually. The macOS arm64 wheels for 1.0.0 and 1.0.1 are
    # built with calculators that require kGpuService, which the Tasks API
    # never installs on the graph, so EVERY task aborts at Open() with
    #   graph_service.h:139] Check failed: service_ Service is unavailable
    # It is an uncatchable abort, not an exception, and no combination of task,
    # running mode or delegate avoids it - verified across all six by
    # scripts/probe_mediapipe.py. 0.10.35 is clean on the same machine.
    # Before raising this pin, run: ./scripts/find_working_mediapipe.sh
    "mediapipe==0.10.35",
    # OpenCV 5 is very new and this project needs nothing from it. Pinned back
    # deliberately; relax it once 5.x has settled on macOS.
    "opencv-python>=4.10,<5",
    "numpy>=1.26",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    # [standard] is not optional in practice: bare uvicorn has no WebSocket
    # implementation, and the pose stream then 404s with only a warning
    # buried in the startup log to explain why.
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
firetv = ["adb-shell>=0.4.4"]
googletv = ["androidtvremote2>=0.1.1"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
gesturectl = "gesturectl.main:main"
gesturectl-server = "gesturectl.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
