[project]
name = "gesturectl"
version = "0.1.0"
description = "Hand-gesture control for TVs and, later, everything else"
requires-python = ">=3.11"
dependencies = [
    # 1.0 moved the Python bindings from pybind11 to a ctypes C API, which is
    # why the wheel is now py3-none and installs on interpreters newer than
    # its stale 3.9-3.12 classifiers claim. The Tasks API is unchanged.
    "mediapipe>=1.0",
    # OpenCV 5 is very new and this project needs nothing from it. Pinned back
    # deliberately; relax it once 5.x has settled on macOS.
    "opencv-python>=4.10,<5",
    "numpy>=1.26",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
firetv = ["adb-shell>=0.4.4"]
googletv = ["androidtvremote2>=0.1.1"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
gesturectl = "gesturectl.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
