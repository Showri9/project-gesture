[project]
name = "gesturectl"
version = "0.1.0"
description = "Hand-gesture control for TVs and, later, everything else"
requires-python = ">=3.11"
dependencies = [
    "mediapipe>=0.10.14",
    "opencv-python>=4.10",
    "numpy>=1.26",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
firetv = ["adb-shell>=0.4.4"]
googletv = ["androidtvremote2>=0.1.1"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
gesturectl = "gesturectl.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
